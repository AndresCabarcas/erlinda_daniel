<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9E7D4E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo verde bosque profundo -->
  <circle cx="32" cy="32" r="30" fill="#2C3E30" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#C5A880" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Anillos de Boda Entrelazados -->
  <g filter="url(#glow)">
    <!-- Anillo Izquierdo -->
    <ellipse cx="26" cy="31" rx="9" ry="11" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" transform="rotate(-15 26 31)"/>
    <!-- Anillo Derecho -->
    <ellipse cx="37" cy="33" rx="9" ry="11" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" transform="rotate(15 37 33)"/>
    
    <!-- Diamante Brillante sobre el anillo -->
    <polygon points="26,17 29,21 26,24 23,21" fill="#FFFFFF" stroke="#C5A880" stroke-width="0.8"/>
    <!-- Destello de luz -->
    <circle cx="26" cy="21" r="1.2" fill="#FFFFFF"/>
    <path d="M26,18 L26,24 M23,21 L29,21" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- Monograma sutil E & D en la parte inferior -->
  <text x="32" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="7.5" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">E &amp; D</text>
</svg>
